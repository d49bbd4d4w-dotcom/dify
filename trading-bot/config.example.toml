# Copy to config.toml and edit. Every key is optional; defaults shown.
[tradebot]
# Kalshi series to scan. KXBTC15M = 15-minute BTC up/down.
# Add "KXBTCD" for the hourly/daily "BTC above $X" ladder.
series = ["KXBTC15M"]

min_edge = 0.03          # need >= 3 cents expected profit per contract after fees
min_minutes_left = 2.0   # ignore markets about to close
max_spread = 0.10        # ignore illiquid markets
max_disagreement = 0.25  # if model and market differ this much, assume we're missing info

vol_multiplier = 1.15    # >1 = assume fatter tails than the recent data shows
momentum_weight = 0.0    # experimental; leave at 0 until `report` proves it helps

bankroll = 100.0         # your starting (paper) bankroll; every stake is sized from it
kelly_multiplier = 0.25  # quarter-Kelly sizing
max_stake = 10.0         # never suggest more than this per pick...
max_bet_fraction = 0.05  # ...or more than 5% of the bankroll
max_open_fraction = 0.6  # at most 60% of the bankroll in unsettled bets

db_path = "tradebot.db"

# Claude write-ups (only used with --explain and ANTHROPIC_API_KEY set)
thesis_model = "claude-opus-5-5"
thesis_effort = "low"

# ----- Sports (needs a free key from https://the-odds-api.com) -----
# odds_api_key = ""          # or set the ODDS_API_KEY environment variable
sports_min_edge = 0.02       # need >= 2 cents expected profit per contract after fees
sports_max_disagreement = 0.10
sports_poll_minutes = 30     # slowed down automatically to make your credits last the month
# sports_series = ["KXNFLGAME", "KXNBAGAME"]   # default: every supported sport

# "bankroll": single picks + big-hitter parlays, all sized from your bankroll.
# "big": only big-payout parlays are sent to Telegram (singles still tracked).
# "all": single picks plus safer / value / long-shot parlays are sent.
sports_style = "bankroll"
big_hitter_payouts = [25, 50, 100]   # payout sizes, as multiples of the stake
parlay_alert_cooldown_hours = 12

# Parlays, built only from legs Kalshi prices below the sharp books (paper-tracked)
parlays_enabled = true
parlay_longshot_payout = 50  # a "long shot" ticket pays at least 50x

timezone = "America/Los_Angeles"   # for times shown in alerts

# Alerts. Easiest is to set the environment variables TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID instead of putting them here (see README "Telegram alerts").
# telegram_bot_token = ""
# telegram_chat_id = ""
# discord_webhook_url = ""
notify_results = true    # also message you when a pick wins or loses
